name: Lean build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib
        run: |
          lake update
          lake exe cache get

      - name: Build the formalization
        run: lake build

      - name: Check axioms of main theorems
        run: |
          set -o pipefail
          printf '%s\n' \
            'import BarycentricClouds' \
            '#print axioms Barycenter.disk_Wpow_mean' \
            '#print axioms Barycenter.disk_Wpow_clt' \
            '#print axioms Barycenter.RadialSample.integral_Wpow_mul_conj' \
            '#print axioms Barycenter.RadialSample.qmom_eq_iff' \
            '#print axioms Barycenter.RadialSample.main_le' \
            '#print axioms Barycenter.main_optimal' \
            '#print axioms Barycenter.RadialSample.tendstoInDistribution_Bimg_clt' \
            '#print axioms Barycenter.RadialSample.tendstoInDistribution_joint_clt' \
            '#print axioms Barycenter.IIDSample.criterion' \
            '#print axioms Barycenter.gauss_mean_value' \
            '#print axioms Barycenter.RadialSample.integral_norm_sq_poly' > AxiomCheck.lean
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then echo "Found sorry"; exit 1; fi
